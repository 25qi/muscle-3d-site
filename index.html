<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />

    <title>Vector · 3D Muscle Explorer</title>

    <!--
      SEO / 分享用中繼資料。正式網址請與你選定的主網域一致(目前設為 Cloudflare)。
      若改用其他網域,更新 canonical 與 og:url 兩處即可。
    -->
    <meta
      name="description"
      content="Free 3D muscle explorer: see where your muscles are before you train. Click any muscle on a 3D body for the best exercises, with equipment, steps and demo GIFs."
    />
    <meta
      name="keywords"
      content="3D muscle explorer, muscle anatomy, exercises by muscle, interactive anatomy, muscle map, workout guide, gym exercises, 3D human body, 肌肉解剖, 健身動作, 3D 人體"
    />
    <meta name="author" content="Veky" />
    <link rel="canonical" href="https://vector-3d-muscle.pages.dev/" />

    <!-- Open Graph（Facebook / LINE / Discord 等分享預覽） -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vector" />
    <meta property="og:title" content="Vector · 3D Muscle Explorer" />
    <meta
      property="og:description"
      content="See where your muscles are before you train. Click any muscle on a 3D body for the best exercises, with equipment, steps and demo GIFs. Free, no signup."
    />
    <meta property="og:url" content="https://vector-3d-muscle.pages.dev/" />
    <meta
      property="og:image"
      content="https://vector-3d-muscle.pages.dev/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vector, 3D Muscle Explorer" />

    <!-- Twitter / X 卡片 -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vector · 3D Muscle Explorer" />
    <meta
      name="twitter:description"
      content="See where your muscles are before you train. Click any muscle on a 3D body for the best exercises, with equipment, steps and demo GIFs. Free, no signup."
    />
    <meta
      name="twitter:image"
      content="https://vector-3d-muscle.pages.dev/og-image.png"
    />

    <!-- 結構化資料：讓 Google 與 AI 搜尋引擎更容易理解這是什麼 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Vector · 3D Muscle Explorer",
        "url": "https://vector-3d-muscle.pages.dev/",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Web browser",
        "description": "A free, interactive 3D muscle explorer that shows where your muscles are before you train and links them to weight training. Rotate and move a 3D human body, click any muscle, and see the best exercises to train it, each with equipment, target and synergist muscles, step by step instructions and a demo GIF.",
        "inLanguage": ["en", "zh-Hant", "es", "fr", "it", "pl", "tr"],
        "author": { "@type": "Person", "name": "Veky" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!--
      在 CSS/JS 下載完成前就先塗上深色底,避免瀏覽器預設白底閃一下。
      這段必須內嵌,不能等外部樣式表。
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!--
      給不執行 JavaScript 的爬蟲看的靜態說明(一般使用者永遠看不到)。
      SPA 的首頁 HTML 幾乎是空的,這段能讓搜尋引擎至少讀到網站在做什麼。
    -->
    <noscript>
      <h1>Vector, a 3D Muscle Explorer</h1>
      <p>
        Vector is a free, interactive 3D muscle explorer that helps you
        understand where your muscles are before you train, and connects that to
        weight training. Freely rotate and move the human body model, click any
        muscle, and the panel on the right lists the best exercises to train it,
        each with equipment, target and synergist muscles, step by step
        instructions and a demo GIF. Besides clicking the model, you can browse
        from the muscle list, save exercises and muscles, and switch between
        seven languages. No signup, no install.
      </p>
      <h2 lang="zh-Hant">Vector, 3D 肌肉探索工具</h2>
      <p lang="zh-Hant">
        Vector 是一個免費的互動式 3D 肌肉探索工具,讓你在運動前更了解自己的肌肉位置,
        並和重量訓練連結在一起。你可以自由旋轉和移動人體模型,點選任何一塊肌肉,
        右側就會列出最適合訓練它的動作,每個動作都附上器材、目標與協同肌群、
        分解步驟和示範動圖 GIF。除了直接點模型,還能用肌肉清單瀏覽,並收藏動作與肌肉,
        以及切換七種語言。免註冊、免安裝。
      </p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
